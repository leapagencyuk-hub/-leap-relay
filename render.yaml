services:
  - type: web
    name: leap-relay
    runtime: node
    plan: starter          # always-on (~$7/mo); the free plan SLEEPS — don't use it
    buildCommand: npm install
    startCommand: node relay.mjs
    healthCheckPath: /health

  # Creator health monitoring: daily export in, Discord cards out.
  # The disk is not optional — "diamonds since joining" and every day-on-day
  # delta are accrued here from the daily uploads and exist nowhere else, so
  # without it a deploy wipes history that cannot be rebuilt.
  - type: web
    name: leap-creator-health
    runtime: node
    plan: starter          # always-on; a sleeping service fails Discord's endpoint check
    buildCommand: npm install
    startCommand: node creator-health/server.mjs
    healthCheckPath: /health
    disk:
      name: creator-data
      mountPath: /opt/render/project/src/creator-health/data
      sizeGB: 1
    envVars:
      # Render supplies PORT; the server binds to it automatically.
      - key: UPLOAD_TOKEN
        sync: false        # set in the Render dashboard, never committed
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_APP_ID
        sync: false

  # Andy: the coaching brain. Reads the Drive library and the creator data,
  # and answers staff questions in Discord.
  #
  # The disk holds the extracted text and the search index. Losing it is not
  # fatal — a sync rebuilds everything from Drive — but that is a slow, paid
  # re-read of the whole folder on every deploy, so the disk stays.
  - type: web
    name: leap-andy
    runtime: node
    plan: starter          # always-on; a sleeping service fails Discord's endpoint check
    buildCommand: cd andy && npm install
    startCommand: node andy/server.mjs
    healthCheckPath: /health
    disk:
      name: andy-brain
      mountPath: /opt/render/project/src/andy/data
      sizeGB: 5
    envVars:
      # Render supplies PORT; the server binds to it automatically.
      - key: ANTHROPIC_API_KEY
        sync: false        # set in the Render dashboard, never committed
      - key: VOYAGE_API_KEY
        sync: false
      - key: ANDY_TOKEN
        sync: false        # protects /sync, /reindex and /ask
      - key: ANDY_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false        # the service account key, base64 or raw JSON
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ANDY_DISCORD_PUBLIC_KEY
        sync: false
      - key: ANDY_DISCORD_APP_ID
        sync: false
      # Andy reads a creator's live numbers from the creator-health service.
      - key: CREATOR_HEALTH_URL
        fromService:
          type: web
          name: leap-creator-health
          property: hostport
      - key: UPLOAD_TOKEN
        sync: false        # the same token creator-health is protected with
